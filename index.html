<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1WIN — Официальное зеркало</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #151b2d;
            --accent: #00e5a0;
            --accent-2: #3b82f6;
            --text: #ffffff;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg) url('images/fon.png') center/cover no-repeat fixed;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
            line-height: 1.4;
        }

        /* dark overlay for readability */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 26, 0.78);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .badge-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 229, 160, 0.12);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: 0.4px;
            border: 1px solid rgba(0, 229, 160, 0.25);
        }

        .badge svg {
            width: 14px;
            height: 14px;
            fill: var(--accent);
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 15px;
        }

        /* Social proof */
        .social-proof {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .social-proof strong {
            color: var(--accent);
        }

        /* Promo block */
        .promo {
            background: rgba(21, 27, 45, 0.92);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 18px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .promo-label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .promo-code-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .promo-code {
            flex: 1;
            background: rgba(0,0,0,0.25);
            border: 1px dashed rgba(0, 229, 160, 0.4);
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--accent);
        }

        .copy-btn {
            background: rgba(0, 229, 160, 0.15);
            color: var(--accent);
            border: 1px solid rgba(0, 229, 160, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .copy-btn:active {
            background: rgba(0, 229, 160, 0.25);
        }

        /* Main CTA */
        .main-cta {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #00e5a0, #00b37a);
            color: #04120c;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 229, 160, 0.25);
            transition: transform 0.15s, box-shadow 0.15s;
            margin-bottom: 28px;
        }

        .main-cta:active {
            transform: scale(0.97);
        }

        /* Games */
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-btn {
            width: 100%;
            height: 56px;
            background: rgba(21, 27, 45, 0.92);
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 12px;
            transition: background 0.15s, border-color 0.15s;
            backdrop-filter: blur(8px);
        }

        .game-btn:active {
            background: #1c2438;
            border-color: rgba(0, 229, 160, 0.3);
        }

        .game-thumb {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            background: #0f1524;
            flex-shrink: 0;
        }

        .game-name {
            flex: 1;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-arrow {
            color: var(--accent);
            font-size: 18px;
            flex-shrink: 0;
        }

        .footer {
            margin-top: 36px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            opacity: 0.7;
        }

        @media (min-width: 480px) {
            .container { max-width: 440px; }
            .title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge-row">
                <div class="badge">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    ОФИЦИАЛЬНОЕ ЗЕРКАЛО
                </div>
            </div>
            <h1 class="title">1WIN</h1>
            <p class="subtitle">Быстрый и безопасный вход</p>
        </div>

        <div class="social-proof">
            <strong>2 847</strong> человек уже забрали бонус сегодня
        </div>

        <div class="promo">
            <div class="promo-label">Промокод на 500% бонус</div>
            <div class="promo-code-row">
                <div class="promo-code" id="promoCode">WINARYA</div>
                <button class="copy-btn" onclick="copyPromo()">Копировать</button>
            </div>
        </div>

        <button class="main-cta" onclick="openCasino()">
            Перейти на сайт →
        </button>

        <div class="section-label">Популярные игры</div>
        <div class="games" id="games">
            <button class="game-btn" onclick="openCasino()">
                <img class="game-thumb" src="images/sugar_rush_1000_thumb.png" alt="Sugar Rush">
                <span class="game-name">Sugar Rush 1000</span>
                <span class="game-arrow">→</span>
            </button>
            <button class="game-btn" onclick="openCasino()">
                <img class="game-thumb" src="images/gates_of_olympus_thumb.png" alt="Gates of Olympus">
                <span class="game-name">Gates of Olympus</span>
                <span class="game-arrow">→</span>
            </button>
            <button class="game-btn" onclick="openCasino()">
                <img class="game-thumb" src="images/starlight_princess_1000_thumb.png" alt="Starlight Princess">
                <span class="game-name">Starlight Princess</span>
                <span class="game-arrow">→</span>
            </button>
            <button class="game-btn" onclick="openCasino()">
                <img class="game-thumb" src="images/the_dogs_house_thumb.png" alt="The Dog House">
                <span class="game-name">The Dog House</span>
                <span class="game-arrow">→</span>
            </button>
        </div>

        <div class="footer">
            18+ · Играйте ответственно
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0b0f1a');
        tg.setBackgroundColor('#0b0f1a');

        const AFF_LINK = 'https://lkeh.pro/bac410a4';

        function openCasino() {
            tg.openLink(AFF_LINK);
        }

        function copyPromo() {
            const code = 'WINARYA';
            navigator.clipboard.writeText(code).then(() => {
                const btn = event.target;
                const old = btn.textContent;
                btn.textContent = 'Скопировано';
                setTimeout(() => btn.textContent = old, 1600);
            }).catch(() => {
                alert(code);
            });
        }
    </script>
</body>
</html>
