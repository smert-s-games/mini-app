<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1WIN — Официальное зеркало</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #151b2d;
            --accent: #00e5a0;
            --accent-2: #3b82f6;
            --text: #ffffff;
            --muted: #94a3b8;
            --danger: #ff4d6d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
            line-height: 1.4;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 229, 160, 0.12);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            border: 1px solid rgba(0, 229, 160, 0.25);
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 15px;
            max-width: 320px;
            margin: 0 auto;
        }

        /* Main CTA */
        .main-cta {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #00e5a0, #00b37a);
            color: #04120c;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 229, 160, 0.25);
            transition: transform 0.15s, box-shadow 0.15s;
            margin-bottom: 28px;
        }

        .main-cta:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(0, 229, 160, 0.2);
        }

        /* Trust text */
        .trust {
            background: var(--card);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .trust p {
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .trust strong {
            color: var(--text);
        }

        /* Games section */
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-btn {
            width: 100%;
            height: 52px; /* roughly 1:3 ratio when full width */
            background: var(--card);
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            transition: background 0.15s, border-color 0.15s;
        }

        .game-btn:active {
            background: #1c2438;
            border-color: rgba(0, 229, 160, 0.3);
        }

        .game-btn span.arrow {
            color: var(--accent);
            font-size: 18px;
        }

        /* Footer */
        .footer {
            margin-top: 36px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            opacity: 0.7;
        }

        /* Desktop fine-tuning */
        @media (min-width: 480px) {
            .container {
                max-width: 440px;
            }
            .title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">ОФИЦИАЛЬНОЕ ЗЕРКАЛО</div>
            <h1 class="title">1WIN</h1>
            <p class="subtitle">Быстрый и безопасный вход на рабочее зеркало</p>
        </div>

        <button class="main-cta" onclick="openCasino()">
            Перейти на сайт →
        </button>

        <div class="trust">
            <p>
                Это <strong>официальное зеркало</strong> 1WIN. <br>
                Сайт работает стабильно, бонусы и депозиты доступны в обычном режиме.
            </p>
        </div>

        <div class="section-label">Популярные игры</div>
        <div class="games" id="games">
            <!-- Кнопки игр будут добавлены позже по твоему списку -->
            <button class="game-btn" onclick="openCasino()">
                <span>Sugar Rush 1000</span>
                <span class="arrow">→</span>
            </button>
            <button class="game-btn" onclick="openCasino()">
                <span>Gates of Olympus</span>
                <span class="arrow">→</span>
            </button>
            <button class="game-btn" onclick="openCasino()">
                <span>Starlight Princess</span>
                <span class="arrow">→</span>
            </button>
            <button class="game-btn" onclick="openCasino()">
                <span>The Dog House</span>
                <span class="arrow">→</span>
            </button>
        </div>

        <div class="footer">
            18+ · Играйте ответственно
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0b0f1a');
        tg.setBackgroundColor('#0b0f1a');

        const AFF_LINK = 'https://lkeh.pro/bac410a4';

        function openCasino() {
            tg.openLink(AFF_LINK);
        }
    </script>
</body>
</html>
