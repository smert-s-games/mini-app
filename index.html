<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Топ Слоты</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background: #1c1c1e; color: white; }
        .header { background: #2c2c2e; padding: 15px; text-align: center; }
        .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 15px; }
        .slot-card { background: #2c2c2e; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .slot-card:hover { transform: scale(1.05); }
        .slot-card img { width: 100%; height: 140px; object-fit: cover; }
        .slot-info { padding: 10px; }
        .slot-name { font-weight: bold; }
        .slot-rtp { color: #4ade80; }
        button { background: #ff2d55; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 Топ Слоты для Заносов</h1>
        <p>Выбирай и забирай бонус</p>
    </div>
    <div class="slot-grid" id="slotGrid"></div>

    <script src="app.js"></script>
</body>
</html>
