<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1WIN — Официальное зеркало</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #151b2d;
            --accent: #00e5a0;
            --text: #ffffff;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg) url('images/fon.png') center/cover no-repeat fixed;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
            line-height: 1.4;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 26, 0.82);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .badge-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 229, 160, 0.12);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 160, 0.25);
        }

        .badge svg {
            width: 14px;
            height: 14px;
            fill: var(--accent);
        }

        .brand-logo {
            width: 150px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
        }

        .subtitle {
            color: var(--muted);
            font-size: 15px;
        }

        .social-proof {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .social-proof strong {
            color: var(--accent);
        }

        .promo {
            background: rgba(21, 27, 45, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 18px;
            text-align: center;
        }

        .promo-label {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
        }

        .promo-highlight {
            display: inline-block;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #00e5a0 0%, #5eead4 40%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(0, 229, 160, 0.45));
            margin-bottom: 12px;
        }

        .promo-code-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .promo-code {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px dashed rgba(0, 229, 160, 0.45);
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--accent);
        }

        .copy-btn {
            background: rgba(0, 229, 160, 0.15);
            color: var(--accent);
            border: 1px solid rgba(0, 229, 160, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .copy-btn:active {
            background: rgba(0, 229, 160, 0.25);
        }

        .main-cta {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #00e5a0, #00b37a);
            color: #04120c;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 229, 160, 0.25);
            margin-bottom: 28px;
            animation: pulse 2.2s ease-in-out infinite;
        }

        .main-cta:active {
            transform: scale(0.97);
            animation: none;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(0, 229, 160, 0.45); }
            70%  { box-shadow: 0 0 0 14px rgba(0, 229, 160, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 229, 160, 0); }
        }

        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-btn {
            position: relative;
            width: 100%;
            height: 88px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            display: block;
            background: #0f1424;
            transition: transform 0.15s;
        }

        .game-btn:active {
            transform: scale(0.98);
        }

        .game-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.45);
        }

        .game-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 14px;
            background: linear-gradient(90deg, rgba(8,11,20,0.85) 0%, rgba(8,11,20,0.55) 100%);
        }

        .game-logo-wrap {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #1a2035;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-name {
            flex: 1;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.2px;
            color: #fff;
            text-shadow:
                0 0 8px rgba(0, 229, 160, 0.35),
                0 2px 4px rgba(0,0,0,0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-arrow {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 229, 160, 0.18);
            color: var(--accent);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(0, 229, 160, 0.3);
        }

        .footer {
            margin-top: 36px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            opacity: 0.7;
        }

        @media (min-width: 480px) {
            .container { max-width: 440px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge-row">
                <div class="badge">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    ОФИЦИАЛЬНОЕ ЗЕРКАЛО
                </div>
            </div>

            <img class="brand-logo" src="images/logo.png" alt="1WIN">
            <p class="subtitle">Быстрый и безопасный вход</p>
        </div>

        <div class="social-proof">
            <strong>2 847</strong> человек уже забрали бонус сегодня
        </div>

        <div class="promo">
            <div class="promo-label">Промокод на</div>
            <div class="promo-highlight">600% бонус</div>
            <div class="promo-code-row">
                <div class="promo-code">WINARYA</div>
                <button class="copy-btn" onclick="copyPromo()">Копировать</button>
            </div>
        </div>

        <button class="main-cta" onclick="openCasino()">
            Перейти на сайт →
        </button>

        <div class="section-label">Популярные игры</div>
        <div class="games">

            <button class="game-btn" onclick="openCasino()">
                <div class="game-bg" style="background-image: url('images/sugar_rush_1000_thumb.png')"></div>
                <div class="game-content">
                    <div class="game-logo-wrap">
                        <img class="game-logo" src="images/sugar_rush_1000_logo.png" alt="">
                    </div>
                    <span class="game-name">Sugar Rush 1000</span>
                    <span class="game-arrow">→</span>
                </div>
            </button>

            <button class="game-btn" onclick="openCasino()">
                <div class="game-bg" style="background-image: url('images/gates_of_olympus_thumb.png')"></div>
                <div class="game-content">
                    <div class="game-logo-wrap">
                        <img class="game-logo" src="images/gates_of_olympus_logo.png" alt="">
                    </div>
                    <span class="game-name">Gates of Olympus</span>
                    <span class="game-arrow">→</span>
                </div>
            </button>

            <button class="game-btn" onclick="openCasino()">
                <div class="game-bg" style="background-image: url('images/starlight_princess_1000_thumb.png')"></div>
                <div class="game-content">
                    <div class="game-logo-wrap">
                        <img class="game-logo" src="images/starlight_princess_1000_logo.png" alt="">
                    </div>
                    <span class="game-name">Starlight Princess</span>
                    <span class="game-arrow">→</span>
                </div>
            </button>

            <button class="game-btn" onclick="openCasino()">
                <div class="game-bg" style="background-image: url('images/the_dogs_house_thumb.png')"></div>
                <div class="game-content">
                    <div class="game-logo-wrap">
                        <img class="game-logo" src="images/the_dogs_house_logo.png" alt="">
                    </div>
                    <span class="game-name">The Dog House</span>
                    <span class="game-arrow">→</span>
                </div>
            </button>

        </div>

        <div class="footer">
            18+ · Играйте ответственно
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0b0f1a');
        tg.setBackgroundColor('#0b0f1a');

        const AFF_LINK = 'https://lkeh.pro/bac410a4';

        function openCasino() {
            tg.openLink(AFF_LINK);
        }

        function copyPromo() {
            navigator.clipboard.writeText('WINARYA').then(() => {
                const btn = event.target;
                const old = btn.textContent;
                btn.textContent = 'Скопировано';
                setTimeout(() => btn.textContent = old, 1600);
            }).catch(() => alert('WINARYA'));
        }
    </script>
</body>
</html>
